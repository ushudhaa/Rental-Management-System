<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Account')}"></head>
<body>
<main class="auth-wrapper">
    <div class="auth-card">
        <h1>RMS</h1>
        <p class="subtitle">Manage your properties</p>

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-login" onclick="showTab('login')">Sign In</button>
            <button type="button" class="auth-tab" id="tab-register" onclick="showTab('register')">Sign Up</button>
        </div>

        <div th:if="${param.error}" class="alert alert-error">Invalid email or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You've been logged out.</div>
        <div th:if="${registerError}" class="alert alert-error" th:text="${registerError}"></div>

        <!-- LOGIN FORM -->
        <form id="form-login" th:action="@{/login}" method="post">
            <label>Email</label>
            <input type="email" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:20px;">Sign In</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="form-register" th:action="@{/register}" th:object="${registerRequest}" method="post" style="display:none;">
            <label>Full Name</label>
            <input type="text" th:field="*{fullName}" required>

            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>Password</label>
            <input type="password" th:field="*{password}" required minlength="6">

            <label>What would you like to do?</label>
            <div class="account-type-choices">
                <label class="account-type-option">
                    <input type="radio" name="accountType" value="USER" checked>
                    <div>
                        <strong>Find a rental property</strong>
                        <p>Browse available rental properties and find a suitable place.</p>
                    </div>
                </label>
                <label class="account-type-option">
                    <input type="radio" name="accountType" value="LANDLORD">
                    <div>
                        <strong>List and manage properties</strong>
                        <p>Add and manage your rental properties.</p>
                    </div>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:20px;">Create Account</button>
        </form>
    </div>
</main>

<script th:inline="javascript">
    function showTab(tab) {
        document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
        document.getElementById('tab-login').classList.toggle('active', tab === 'login');
        document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    }
    /*<![CDATA[*/
    var initialTab = /*[[${activeTab}]]*/ 'login';
    /*]]>*/
    if (initialTab === 'register') showTab('register');
</script>
</body>
</html>
