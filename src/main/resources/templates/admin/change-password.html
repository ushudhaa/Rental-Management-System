<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Change Password')}"></head>
<body class="admin-shell">
<aside class="admin-sidebar">
  <div class="sidebar-brand">RMS</div>
  <div class="sidebar-section">MAIN MENU</div>
  <a href="/admin/dashboard" class="sidebar-link"><span class="sidebar-icon">D</span> Dashboard</a>
  <a href="/admin/users" class="sidebar-link"><span class="sidebar-icon">U</span> Users</a>
  <div class="sidebar-section">SYSTEM</div>
  <a href="/swagger-ui.html" target="_blank" class="sidebar-link"><span class="sidebar-icon">A</span> API Documentation</a>
  <div class="sidebar-section">ACCOUNT</div>
  <a href="/admin/profile" class="sidebar-link active"><span class="sidebar-icon">P</span> Profile</a>
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="sidebar-link sidebar-logout"><span class="sidebar-icon">L</span> Logout</button>
  </form>
</aside>

<div class="admin-main">
  <header class="admin-topbar"><h1>Change Password</h1></header>
  <div class="admin-content">
    <div class="profile-wrap">
      <div class="profile-card" style="max-width:480px;">
        <h2>Update Password</h2>
        <div th:if="${pwError}" class="alert alert-error" th:text="${pwError}"></div>
        <form th:action="@{/admin/profile/change-password}" method="post">
          <label>Current Password</label>
          <input type="password" name="currentPassword" required>

          <label>New Password</label>
          <input type="password" name="newPassword" required minlength="6">

          <label>Confirm New Password</label>
          <input type="password" name="confirmPassword" required minlength="6">

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Password</button>
            <a href="/admin/profile" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
