<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="bell">
  <div class="notif-wrapper">
    <button type="button" class="notif-bell" id="notifTrigger" onclick="toggleNotif()">
      &#128276;
      <span class="notif-badge" id="notifBadge" style="display:none;"></span>
    </button>
    <div id="notifDropdown" class="notif-dropdown">
      <div class="notif-header">
        Notifications
        <a href="#" onclick="markAllNotifsRead(event)"
           style="float:right; font-weight:400; font-size:0.75rem;">Mark all as read</a>
      </div>
      <div id="notifList">
        <div class="notif-item notif-empty">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    function toggleNotif() {
      const dd = document.getElementById('notifDropdown');
      dd.classList.toggle('open');
      if (dd.classList.contains('open')) loadNotifications();
    }

    document.addEventListener('click', function (e) {
      const dd = document.getElementById('notifDropdown');
      const trigger = document.getElementById('notifTrigger');
      if (dd && !dd.contains(e.target) && trigger && !trigger.contains(e.target)) {
        dd.classList.remove('open');
      }
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : str;
      return div.innerHTML;
    }

    function loadUnreadCount() {
      fetch('/notifications/unread-count')
              .then(r => r.json())
              .then(data => {
                const badge = document.getElementById('notifBadge');
                if (data.count > 0) {
                  badge.textContent = data.count > 9 ? '9+' : data.count;
                  badge.style.display = 'inline-block';
                } else {
                  badge.style.display = 'none';
                }
              })
              .catch(() => {});
    }

    function loadNotifications() {
      fetch('/notifications/recent')
              .then(r => r.json())
              .then(items => {
                const list = document.getElementById('notifList');
                if (!items.length) {
                  list.innerHTML = '<div class="notif-item notif-empty">No notifications yet</div>';
                  return;
                }
                list.innerHTML = items.map(function (n) {
                  const style = n.read ? 'opacity:0.6;' : 'font-weight:600;';
                  return '<a href="' + (n.link ? n.link : '#') + '" class="notif-item" style="' + style + '"'
                          + ' onclick="markNotifRead(event, ' + n.id + ')">'
                          + '<div>' + escapeHtml(n.title) + '</div>'
                          + '<div style="font-weight:400; font-size:0.8rem; color: var(--grey-500);">'
                          + escapeHtml(n.message) + '</div>'
                          + '</a>';
                }).join('');
              })
              .catch(() => {});
    }

    function markNotifRead(event, id) {
      fetch('/notifications/' + id + '/read', {method: 'PATCH'}).then(loadUnreadCount);
    }

    function markAllNotifsRead(event) {
      event.preventDefault();
      fetch('/notifications/mark-all-read', {method: 'PATCH'})
              .then(function () {
                loadUnreadCount();
                loadNotifications();
              });
    }

    document.addEventListener('DOMContentLoaded', function () {
      loadUnreadCount();
      setInterval(loadUnreadCount, 30000);
    });
  </script>
</th:block>

</body>
</html>
