<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Register')}"></head>
<body>
<main class="auth-wrapper">
    <div class="auth-card">
        <h1>Create Account</h1>
        <p class="subtitle">Sign up to manage your properties</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post" th:unless="${success}">
            <label>Full Name</label>
            <input type="text" th:field="*{fullName}" required>

            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>Password</label>
            <input type="password" th:field="*{password}" required minlength="6">

            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:20px;">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
        </p>
    </div>
</main>
</body>
</html>
