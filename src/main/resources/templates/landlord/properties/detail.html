<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${property.title})}"></head>
<body class="admin-shell">
<aside class="admin-sidebar">
  <div class="sidebar-brand">RMS</div>
  <div class="sidebar-section">MAIN MENU</div>
  <a href="/landlord/dashboard" class="sidebar-link"><span class="sidebar-icon">D</span> Dashboard</a>
  <a href="/landlord/properties" class="sidebar-link active"><span class="sidebar-icon">H</span> My Properties</a>
  <a href="/landlord/payments" class="sidebar-link"><span class="sidebar-icon">$</span> My Payments</a>
  <div class="sidebar-section">ACCOUNT</div>
  <a href="/landlord/profile" class="sidebar-link"><span class="sidebar-icon">P</span> Profile</a>
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="sidebar-link sidebar-logout"><span class="sidebar-icon">L</span> Logout</button>
  </form>
</aside>

<div class="admin-main">
  <header class="admin-topbar"><h1 th:text="${property.title}"></h1></header>
  <div class="admin-content">
    <a href="/landlord/properties" class="btn-back">&larr; Back to My Properties</a>

    <div class="profile-card" style="max-width:700px; margin-top:16px;">
      <p><strong>Location:</strong> <span th:text="${property.city}"></span></p>
      <p><strong>Address:</strong> <span th:text="${property.address}"></span></p>
      <p><strong>Monthly Rent:</strong> <span th:text="${property.rentAmount}"></span></p>
      <p><strong>Status:</strong>
        <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(property.status)}" th:text="${property.status}"></span>
      </p>
      <p th:if="${property.description}"><strong>Description:</strong> <span th:text="${property.description}"></span></p>
      <p><strong>Created:</strong> <span th:text="${#temporals.format(property.createdAt, 'MMM dd, yyyy')}"></span></p>
      <p><strong>Last Updated:</strong> <span th:text="${#temporals.format(property.updatedAt, 'MMM dd, yyyy')}"></span></p>

      <div class="form-actions">
        <a th:href="@{/landlord/properties/edit/{id}(id=${property.id})}" class="btn btn-primary">Edit Property</a>
        <form th:action="@{/landlord/properties/{id}/delete(id=${property.id})}" method="post"
              onsubmit="return confirm('Delete this property? This action cannot be undone.');">
          <button type="submit" class="btn btn-danger">Delete Property</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
