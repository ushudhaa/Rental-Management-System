<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${isEdit} ? 'Edit Payment' : 'Add Payment')}"></head>
<body class="admin-shell">
<aside class="admin-sidebar">
  <div class="sidebar-brand">RMS</div>
  <div class="sidebar-section">MAIN MENU</div>
  <a href="/landlord/dashboard" class="sidebar-link"><span class="sidebar-icon">D</span> Dashboard</a>
  <a href="/landlord/properties" class="sidebar-link"><span class="sidebar-icon">H</span> My Properties</a>
  <a href="/landlord/payments" class="sidebar-link active"><span class="sidebar-icon">$</span> My Payments</a>
  <div class="sidebar-section">ACCOUNT</div>
  <a href="/landlord/profile" class="sidebar-link"><span class="sidebar-icon">P</span> Profile</a>
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="sidebar-link sidebar-logout"><span class="sidebar-icon">L</span> Logout</button>
  </form>
</aside>

<div class="admin-main">
  <header class="admin-topbar"><h1 th:text="${isEdit} ? 'Edit Payment' : 'Add Payment'"></h1></header>
  <div class="admin-content">
    <form th:action="${isEdit} ? @{/landlord/payments/{id}(id=${paymentId})} : @{/landlord/payments}"
          th:object="${paymentRequest}" method="post" class="form-card">

      <label>Property</label>
      <select th:field="*{propertyId}" required>
        <option th:each="p : ${properties}" th:value="${p.id}" th:text="${p.title} + ' (' + ${p.city} + ')'"></option>
      </select>

      <label>Tenant Name</label>
      <input type="text" th:field="*{tenantName}" required>

      <div class="form-row">
        <div>
          <label>Amount</label>
          <input type="number" step="0.01" th:field="*{amount}" required>
        </div>
        <div>
          <label>Due Date</label>
          <input type="date" th:field="*{dueDate}" required>
        </div>
        <div>
          <label>Payment Date</label>
          <input type="date" th:field="*{paymentDate}">
        </div>
      </div>

      <div class="form-row">
        <div>
          <label>Payment Method</label>
          <select th:field="*{paymentMethod}">
            <option value="">-- none --</option>
            <option th:each="m : ${T(com.example.RentalManagementSystem.enums.PaymentMethod).values()}"
                    th:value="${m}" th:text="${m}"></option>
          </select>
        </div>
        <div>
          <label>Status</label>
          <select th:field="*{status}">
            <option th:each="s : ${T(com.example.RentalManagementSystem.enums.PaymentStatus).values()}"
                    th:value="${s}" th:text="${s}"></option>
          </select>
        </div>
      </div>

      <label>Reference Number</label>
      <input type="text" th:field="*{referenceNumber}">

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Update' : 'Create'"></button>
        <a href="/landlord/payments" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
