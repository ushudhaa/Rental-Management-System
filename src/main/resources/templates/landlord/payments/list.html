<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('My Payments')}"></head>
<body class="admin-shell">
<aside class="admin-sidebar">
  <div class="sidebar-brand">RMS</div>
  <div class="sidebar-section">MAIN MENU</div>
  <a href="/landlord/dashboard" class="sidebar-link"><span class="sidebar-icon">D</span> Dashboard</a>
  <a href="/landlord/properties" class="sidebar-link"><span class="sidebar-icon">H</span> My Properties</a>
  <a href="/landlord/payments" class="sidebar-link active"><span class="sidebar-icon">$</span> My Payments</a>
  <div class="sidebar-section">ACCOUNT</div>
  <a href="/landlord/profile" class="sidebar-link"><span class="sidebar-icon">P</span> Profile</a>
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="sidebar-link sidebar-logout"><span class="sidebar-icon">L</span> Logout</button>
  </form>
</aside>

<div class="admin-main">
  <header class="admin-topbar"><h1>My Payments</h1></header>
  <div class="admin-content">
    <div class="page-header">
      <div>
        <h1>My Payments</h1>
        <div class="subtitle">View and manage payments related to your properties.</div>
      </div>
      <a href="/landlord/payments/new" class="btn btn-primary">+ Add Payment</a>
    </div>

    <div th:if="${paymentPage.content.isEmpty()}" class="empty-state"><p>No payments recorded yet.</p></div>

    <table class="data-table" th:unless="${paymentPage.content.isEmpty()}">
      <thead><tr><th>Property</th><th>Tenant</th><th>Amount</th><th>Due Date</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
      <tr th:each="pay : ${paymentPage.content}">
        <td th:text="${pay.propertyTitle}"></td>
        <td th:text="${pay.tenantName}"></td>
        <td th:text="${pay.amount}"></td>
        <td th:text="${pay.dueDate}"></td>
        <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(pay.status)}" th:text="${pay.status}"></span></td>
        <td class="actions">
          <a th:href="@{/landlord/payments/edit/{id}(id=${pay.id})}" class="btn btn-sm btn-secondary">Edit</a>
          <form th:action="@{/landlord/payments/{id}/mark-paid(id=${pay.id})}" method="post" style="display:inline">
            <button type="submit" class="btn btn-sm btn-success">Mark Paid</button>
          </form>
          <form th:action="@{/landlord/payments/{id}/delete(id=${pay.id})}" method="post" style="display:inline"
                onsubmit="return confirm('Delete this payment?');">
            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

    <div class="pagination" th:if="${paymentPage.totalPages > 1}">
      <a th:each="i : ${#numbers.sequence(0, paymentPage.totalPages - 1)}"
         th:href="@{/landlord/payments(page=${i})}"
         th:text="${i + 1}"
         th:classappend="${i == paymentPage.number} ? 'active' : ''"></a>
    </div>
  </div>
</div>
</body>
</html>
