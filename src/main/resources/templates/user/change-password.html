<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body><!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Change Password')}"></head>
<body class="admin-shell">
<aside class="admin-sidebar">
    <div class="sidebar-brand">RMS</div>
    <div class="sidebar-section">MAIN MENU</div>
    <a href="/user/dashboard" class="sidebar-link"><span class="sidebar-icon">D</span> Dashboard</a>
    <a href="/user/properties" class="sidebar-link"><span class="sidebar-icon">B</span> Browse Properties</a>
    <div class="sidebar-section">ACCOUNT</div>
    <a href="/user/profile" class="sidebar-link active"><span class="sidebar-icon">P</span> Profile</a>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="sidebar-link sidebar-logout"><span class="sidebar-icon">L</span> Logout</button>
    </form>
</aside>

<div class="admin-main">
    <header class="admin-topbar"><h1>Change Password</h1></header>
    <div class="admin-content">
        <div class="profile-wrap">
            <div class="profile-card" style="max-width:480px;">
                <h2>Update Password</h2>
                <div th:if="${pwError}" class="alert alert-error" th:text="${pwError}"></div>
                <form th:action="@{/user/profile/change-password}" method="post">
                    <label>Current Password</label>
                    <input type="password" name="currentPassword" required>
                    <label>New Password</label>
                    <input type="password" name="newPassword" required minlength="6">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirmPassword" required minlength="6">
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Update Password</button>
                        <a href="/user/profile" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

</body>
</html>
