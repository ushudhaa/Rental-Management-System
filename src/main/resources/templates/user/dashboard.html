<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Dashboard')}"></head>
<body class="admin-shell">
<button type="button" class="sidebar-toggle" onclick="document.querySelector('.admin-sidebar').classList.toggle('open')">Menu</button>
<aside class="admin-sidebar">
  <div class="sidebar-brand">RMS</div>
  <div class="sidebar-section">MAIN MENU</div>
  <a href="/user/dashboard" class="sidebar-link active"><span class="sidebar-icon">D</span> Dashboard</a>
  <a href="/user/properties" class="sidebar-link"><span class="sidebar-icon">B</span> Browse Properties</a>
  <div class="sidebar-section">ACCOUNT</div>
  <a href="/user/profile" class="sidebar-link"><span class="sidebar-icon">P</span> Profile</a>
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="sidebar-link sidebar-logout"><span class="sidebar-icon">L</span> Logout</button>
  </form>
</aside>

<div class="admin-main">
  <header class="admin-topbar"><h1>Dashboard</h1></header>
  <div class="admin-content">
    <div class="dashboard-hero">
      <h1>Dashboard</h1>
      <p th:text="'Welcome back, ' + ${#authentication.name} + '. Find a property that suits your needs.'"></p>
    </div>
    <div class="page-header"><h2 style="font-size:1.1rem;">Available Properties</h2></div>
    <div class="stat-grid" style="grid-template-columns: repeat(1, 220px);">
      <div class="stat-card">
        <div class="stat-value" th:text="${availableCount}"></div>
        <div class="stat-title">Available Properties</div>
      </div>
    </div>

    <div class="quick-actions">
      <a href="/user/properties" class="btn btn-primary">Browse Properties</a>
    </div>

    <div class="page-header"><h2 style="font-size:1.1rem;">Recently Added Properties</h2></div>
    <div th:if="${recentProperties.isEmpty()}" class="empty-state"><p>No available properties right now.</p></div>

    <div class="property-grid" th:unless="${recentProperties.isEmpty()}">
      <div class="property-card" th:each="p : ${recentProperties}">
        <div class="property-img-placeholder">Property</div>
        <div class="property-card-body">
          <div class="property-card-title" th:text="${p.title}"></div>
          <div class="property-card-loc" th:text="${p.city}"></div>
          <div class="property-card-rent" th:text="'NPR ' + ${p.rentAmount} + ' per month'"></div>
          <div class="property-card-meta" th:text="${p.bedrooms} + ' Bedrooms'"></div>
          <span class="badge badge-paid">AVAILABLE</span>
          <a th:href="@{/user/properties/{id}(id=${p.id})}" class="btn btn-sm btn-primary" style="margin-top:10px; display:inline-block;">View Details</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
